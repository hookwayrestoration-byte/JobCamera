
name: Build Hookway Job Camera APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, business-setup-test]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore permanent signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$HOME/.android/hookway-release.jks"
          test -s "$HOME/.android/hookway-release.jks"

      - name: Build signed debug APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
        run: |
          gradle assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$HOME/.android/hookway-release.jks" \
            -Pandroid.injected.signing.store.password="$SIGNING_KEY_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD"

      - name: Print signing fingerprints
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/hookway-release.jks" \
            -alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            -storepass "${{ secrets.SIGNING_KEY_STORE_PASSWORD }}" |
            grep -E 'SHA1:|SHA256:'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HookwayJobCamera-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
