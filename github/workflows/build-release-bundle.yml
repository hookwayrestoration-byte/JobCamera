json
{
"name": "Build release APK (install on tablet)",
"on": {
"workflow_dispatch": {},
"push": { "branches": ["business-setup-test"] }
},
"jobs": {
"apk": {
"runs-on": "ubuntu-latest",
"steps": [
{ "uses": "actions/checkout@v4" },
{ "uses": "actions/setup-java@v4",
"with": { "distribution": "temurin", "java-version": "17" } },
{ "uses": "gradle/actions/setup-gradle@v4",
"with": { "gradle-version": "8.11.1" } },
{ "name": "Restore signing key",
"env": { "SIGNING_KEY_BASE64": "${{ secrets.SIGNING_KEY_BASE64 }}" },
"run": "mkdir -p \"$HOME/.android\"\necho \"$SIGNING_KEY_BASE64\" | base64 --decode > \"$HOME/.android/hookway-release.jks\"\ntest -s \"$HOME/.android/hookway-release.jks\"" },
{ "name": "Build signed release APK",
"env": {
"SIGNING_KEY_ALIAS": "${{ secrets.SIGNING_KEY_ALIAS }}",
"SIGNING_KEY_PASSWORD": "${{ secrets.SIGNING_KEY_PASSWORD }}",
"SIGNING_KEY_STORE_PASSWORD": "${{ secrets.SIGNING_KEY_STORE_PASSWORD }}"
},
"run": "gradle assembleRelease --no-daemon -Pandroid.injected.signing.store.file=\"$HOME/.android/hookway-release.jks\" -Pandroid.injected.signing.store.password=\"$SIGNING_KEY_STORE_PASSWORD\" -Pandroid.injected.signing.key.alias=\"$SIGNING_KEY_ALIAS\" -Pandroid.injected.signing.key.password=\"$SIGNING_KEY_PASSWORD\"" },
{ "uses": "actions/upload-artifact@v4",
"with": {
"name": "JobCamera-release-apk",
"path": "app/build/outputs/apk/release/*.apk",
"if-no-files-found": "error",
"retention-days": 14
} }
]
}
}
}
